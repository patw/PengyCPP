# Build PengyCPP releases on version tags
#
# Produces and attaches to GitHub Release:
#   Linux:   .deb + AppImage
#   macOS:   .dmg
#   Windows: Pengy-Windows.zip (Qt + MSVC runtime DLLs bundled) + .msi installer
#
# Usage:
#   git tag v1.3.0 && git push --tags
#
# Manual test builds (no release is created or touched):
#   Actions tab -> Release -> "Run workflow", pick a branch and platform, or
#   gh workflow run release.yml --ref <branch> -f platform=windows
# The packages are attached to that run as downloadable artifacts instead.
#
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build'
        type: choice
        default: windows
        options:
          - windows
          - linux
          - macos
          - all

env:
  # e.g. v1.3.0 on tag builds. Empty on manual runs, so build_deb.sh falls
  # back to CMakeLists.txt's version instead of packaging version "main".
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb + AppImage)
    if: github.event_name == 'push' || contains(fromJSON('["linux","all"]'), inputs.platform)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake patchelf qt6-base-dev qt6-svg-dev qt6-wayland libqt6waylandclient6 libgl-dev dpkg-dev \
            libreadline-dev libfuse2 fuse3 imagemagick qt6-declarative-dev-tools

      - name: Install Qt6
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Report Qt in use
        run: |
          echo "QT_ROOT_DIR=${QT_ROOT_DIR:-unset}"
          "${QT_ROOT_DIR}/bin/qmake" -query QT_VERSION 2>/dev/null || true

      - name: Build .deb package
        run: |
          # build_deb.sh always builds from source + creates .deb
          ./build_deb.sh

      - name: Build AppImage
        run: |
          # Ensure build directory exists (build_deb.sh already did this)
          # but AppImage build script needs its own flow
          # Dated linuxdeploy releases plus a checksum, never the rolling
          # `continuous` tag: this job holds contents: write and publishes
          # release assets, so it executes audited bytes from a fixed URL.
          # Moving either pin is a deliberate act, reviewed like a dependency.
          mkdir -p appimage/tools
          wget -q -P appimage/tools \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget -q -P appimage/tools \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          printf '%s\n' \
            'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  appimage/tools/linuxdeploy-x86_64.AppImage' \
            '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  appimage/tools/linuxdeploy-plugin-qt-x86_64.AppImage' \
            | sha256sum -c -
          chmod +x appimage/tools/*.AppImage
          cd appimage && ./build.sh

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            pengy_*.deb
            Pengy-x86_64.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pengy-Linux-${{ github.sha }}
          path: |
            pengy_*.deb
            Pengy-x86_64.AppImage
          retention-days: 7

  macos:
    name: macOS (DMG)
    if: github.event_name == 'push' || contains(fromJSON('["macos","all"]'), inputs.platform)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install cmake

      - name: Install Qt6
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.10.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Report Qt in use
        run: |
          echo "QT_ROOT_DIR=${QT_ROOT_DIR:-unset}"
          "${QT_ROOT_DIR}/bin/qmake" -query QT_VERSION 2>/dev/null || true

      - name: Build DMG
        run: ./build_macos.sh

      - name: Upload DMG
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Pengy-macOS-*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pengy-macOS-${{ github.sha }}
          path: Pengy-macOS-*.dmg
          retention-days: 7

  windows:
    name: Windows (Zip + MSI)
    if: github.event_name == 'push' || contains(fromJSON('["windows","all"]'), inputs.platform)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'  # lightweight, catches potential missing deps

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Build
        shell: cmd
        run: |
          @echo on
          where cl.exe
          REM install-qt-action sets QT_ROOT_DIR
          if "%QT_ROOT_DIR%"=="" (
            echo ERROR: QT_ROOT_DIR not set
            exit /b 1
          )
          echo Using Qt: %QT_ROOT_DIR%
          cmake -B build_windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" || exit /b 1
          cmake --build build_windows || exit /b 1
          mkdir Pengy-Windows
          copy build_windows\pengy.exe Pengy-Windows\ || exit /b 1
          cd Pengy-Windows
          windeployqt --no-compiler-runtime pengy.exe

      # Ship the MSVC runtime DLLs app-locally instead of windeployqt's
      # vc_redist.x64.exe, which zip users had to find and run themselves and
      # an MSI cannot run for them.
      - name: Bundle MSVC runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT' |
            Select-Object -First 1
          if (-not $crt) { throw "MSVC CRT redist not found under $env:VCToolsRedistDir" }
          Copy-Item (Join-Path $crt.FullName '*.dll') Pengy-Windows\
          Get-ChildItem Pengy-Windows\*.dll | Select-Object Name, Length | Format-Table

      # Runs on every build, release or test, before anything is packaged.
      - name: Smoke test
        shell: powershell
        run: .github\scripts\windows-smoke-test.ps1 -Exe Pengy-Windows\pengy.exe

      - name: Install WiX
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $env:PATH = "$tools;$env:PATH"
          $tools >> $env:GITHUB_PATH
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix --version

      # The version comes from CMakeLists.txt's project(Pengy VERSION x.y.z),
      # like build_macos.sh. A second MSI with the build number bumped lets
      # the next step test upgrading.
      - name: Build MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Select-String -Path CMakeLists.txt -Pattern '^project\(Pengy VERSION (\d+)\.(\d+)\.(\d+)' | Select-Object -First 1
          $g = $m.Matches[0].Groups
          $major = $g[1].Value; $minor = $g[2].Value; $patch = $g[3].Value
          $version = "$major.$minor.$patch"
          $label = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev' }
          msi\build.ps1 -AppDir Pengy-Windows -Version $version -Out "Pengy-Windows-$label.msi"
          msi\build.ps1 -AppDir Pengy-Windows -Version "$major.$minor.$([int]$patch + 1)" `
            -Out "$env:RUNNER_TEMP\Pengy-next.msi"
          "MSI_FILE=Pengy-Windows-$label.msi" >> $env:GITHUB_ENV

      - name: Test MSI install, upgrade, uninstall
        shell: powershell
        run: .github\scripts\windows-msi-test.ps1 -Msi $env:MSI_FILE -NextMsi "$env:RUNNER_TEMP\Pengy-next.msi"

      - name: Zip artifacts
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          Compress-Archive -Path Pengy-Windows\* -DestinationPath Pengy-Windows-${{ github.ref_name }}.zip

      - name: Upload Windows Zip + MSI
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Pengy-Windows-*.zip
            Pengy-Windows-*.msi
          generate_release_notes: true
          fail_on_unmatched_files: false

      # Manual runs: the folder is uploaded as-is (GitHub zips it for
      # download), so there is no zip-inside-a-zip.
      - name: Upload test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pengy-Windows-${{ github.sha }}
          path: Pengy-Windows/
          retention-days: 7

      - name: Upload test MSI
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pengy-Windows-MSI-${{ github.sha }}
          path: ${{ env.MSI_FILE }}
          retention-days: 7

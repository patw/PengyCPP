name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libgl-dev libreadline-dev

      - name: Install Qt6
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Build and Verify
        run: |
          set -ex
          "${QT_ROOT_DIR}/bin/qmake" -query QT_VERSION

          echo "=== Versions ==="
          g++ --version | head -1
          cmake --version | head -1

          echo "=== CMake Configure ==="
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cd ..

          echo "=== CMake Build ==="
          cd build
          make -j$(nproc)
          cd ..

          echo "=== Verify ==="
          ls -lh build/pengy build/pengy-cli build/pengy-web
          file build/pengy

          # All seven test binaries were registered with add_test and nothing
          # ever ran them, so a reverted skill asset -- or any of the other
          # regressions they guard -- could ship unnoticed.
          echo "=== Tests ==="
          cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
